<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="icons/icon32.png" type="image/png" sizes="32x32" />
    <title>Recording · BugSnap</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      html, body { height: 100%; margin: 0; background: var(--surface, #fff); }
      body { display: grid; }
      #frame { grid-area: 1 / 1; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity .2s ease; }
      body.ready #frame { opacity: 1; }
      .wait, .fail { grid-area: 1 / 1; place-self: center; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 24px; color: var(--muted, #5d5d66); font-size: 14px; }
      .wait .icon { width: 26px; height: 26px; animation: spin .9s linear infinite; }
      body.ready .wait, .fail[hidden] { display: none; }
      .fail strong { color: var(--text, #18181b); font-size: 16px; }
      .fail .row { display: flex; gap: 8px; margin-top: 6px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* As its own tab (pages that block extensions): a page around the dialog */
      body.tab { background: #e9e9ec; padding: 24px; box-sizing: border-box; }
      body.tab #frame { border-radius: 20px; box-shadow: 0 30px 80px rgb(0 0 0 / 0.18); background: #fff; }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Share or report" allow="clipboard-write; clipboard-read; autoplay; fullscreen"></iframe>
    <div class="wait" id="wait"><span class="icon" data-icon="spinner-gap"></span><span>Opening…</span></div>
    <div class="fail" id="fail" hidden>
      <strong>Couldn't open the recording</strong>
      <span id="failText">Is the BugSnap server running?</span>
      <div class="row">
        <button class="btn" id="failClose">Close</button>
        <button class="btn primary" id="failOpen">Open in the player</button>
      </div>
    </div>
    <script src="lib/icons.js"></script>
    <script type="module" src="review.js"></script>
  </body>
</html>
